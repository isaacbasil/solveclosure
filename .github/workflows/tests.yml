name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    # tests that need no OpenFOAM
    name: fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install solveclosure
        run: python -m pip install . pytest
      - name: Run the fast tests
        run: python -m pytest -m "not openfoam" -v

  openfoam:
    # all tests, with OpenFOAM v2412 from conda-forge. The parallel test is left out: it needs an
    # MPI set-up that is checked locally instead.
    name: OpenFOAM tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: solveclosure
          create-args: >-
            python=3.12
            openfoam=2412
          channels: conda-forge
          cache-environment: true
      - name: Install solveclosure
        run: python -m pip install . pytest
      - name: Run the OpenFOAM tests
        run: |
          export SOLVECLOSURE_LOAD_OF_CMD="source $CONDA_PREFIX/etc/bashrc"
          python -m pytest -m "openfoam and not parallel" -v
