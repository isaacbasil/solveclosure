[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "solveclosure"
version = "0.2.0"
description = "A package that solves the closure problem for the dual-continuum model published by Paten et al."
authors = [
  { name="Isaac Paten", email="isaacbpaten@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "tifffile",
    "numpy>=1.23",
    "matplotlib",
    "scikit-image",
    "scipy",
    "imagecodecs",
]

[tool.setuptools.package-data]
"solveclosure" = ["templates/**/*", "example_data/*.tif"]

[project.optional-dependencies]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=2.0",
]

[project.urls]
Homepage = "https://github.com/isaacbasil/solveclosure"
Documentation = "https://solveclosure.readthedocs.io"
Changelog = "https://github.com/isaacbasil/solveclosure/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "openfoam: needs an OpenFOAM installation (skipped if none is found)",
    "parallel: runs OpenFOAM in parallel, so also needs MPI",
]
